---
name: pecdm
# Every dependency is pinned here and installed with `bolt module install`.
# The provider Terraform modules are not Puppet modules, so they install with
# resolve: false and land in .modules/<provider>_pe_arch. Their state does not
# live there: see pecdm::terraform_dirs.
modules:
  - name: puppetlabs-peadm
    version_requirement: 3.38.3
  - name: puppetlabs-terraform
    version_requirement: 0.8.0
  - name: google_pe_arch
    git: https://github.com/puppetlabs/terraform-google-pe_arch.git
    ref: 5772aebc633f72acb031d6c4b5f786e99a451a65
    resolve: false
  - name: aws_pe_arch
    git: https://github.com/puppetlabs/terraform-aws-pe_arch.git
    ref: e5a731c727e73e50d95020a0f2913f86f4ec9c1c
    resolve: false
  - name: azure_pe_arch
    git: https://github.com/puppetlabs/terraform-azure-pe_arch.git
    ref: 0c362beddede71a83e10f76e873d85da01d9acea
    resolve: false
