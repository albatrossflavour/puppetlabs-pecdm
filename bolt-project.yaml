---
name: pecdm
# Every dependency is pinned here and installed with `bolt module install`.
# The provider Terraform modules are not Puppet modules, so they install with
# resolve: false and land in .modules/<provider>_pe_arch. Their state does not
# live there: see pecdm::terraform_dirs.
modules:
  - name: puppetlabs-peadm
    version_requirement: 3.38.3
  - name: puppetlabs-terraform
    version_requirement: 0.8.0
  - name: google_pe_arch
    git: https://github.com/albatrossflavour/terraform-google-pe_arch.git
    ref: 6ba92b165a6619be282ba987f56c6e0ab4099b40
    resolve: false
  - name: aws_pe_arch
    git: https://github.com/albatrossflavour/terraform-aws-pe_arch.git
    ref: 75f0fca819cb954bb0bd605a98f0e96478855bf3
    resolve: false
  - name: azure_pe_arch
    git: https://github.com/albatrossflavour/terraform-azure-pe_arch.git
    ref: 8715cc3245ee499a2fad1ac72abeeb270847b899
    resolve: false
  - name: proxmox_pe_arch
    git: https://github.com/albatrossflavour/terraform-proxmox-pe_arch.git
    ref: 07cb631b99add23170f9f117f7779ca5a71967d9
    resolve: false
